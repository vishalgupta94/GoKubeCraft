<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Stock</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .error {
      color: red;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main class="container mt-5">
    <!-- When customer is registered -->
    <div class="row">
      <div class="col-md-3"></div>
      <div class="col-md-5">
        <h1>Hello John Doe</h1>
        <p>
          You are ready to place a trade. For demonstration purposes, several of
          your trade parameters are fixed. Simply specify how many shares you'd
          like to buy, then submit the trade.
        </p>
        <span class="error"></span>
        <span class="error"></span>
        <form id="trade-stock" class="form-inline">
          <span class="error"></span><br />
          <input id="share_count" type="text" class="form-control" />
          <br /><br />
          <button id="form_submit" class="btn btn-primary">
            Purchase shares
          </button>
        </form>
      </div>
    </div>

    <!-- When customer is NOT registered -->
    <div class="row mt-5">
      <div class="col-md-3"></div>
      <div class="col-md-5">
        <h1 class="page-header">Open an Account</h1>
        <p>
          To get started with trading, open an account, then come back here.
        </p>
      </div>
    </div>
  </main>
</body>
</html>
